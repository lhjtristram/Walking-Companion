name: WalkingCompanion

options:
  bundleIdPrefix: com.lhjtristram
  deploymentTarget:
    iOS: "26.0"
    watchOS: "26.0"
  xcodeVersion: "26.0"
  createIntermediateGroups: true
  groupSortPosition: none

settings:
  base:
    SWIFT_VERSION: "5.0"
    ENABLE_PREVIEWS: "YES"
    DEBUG_INFORMATION_FORMAT: dwarf-with-dsym

targets:

  # ── iPhone app ─────────────────────────────────────────────────────────────
  WalkingCompanion:
    type: application
    platform: iOS
    deploymentTarget: "26.0"

    info:
      path: WalkingCompanion/Info.plist

    sources:
      - path: WalkingCompanion
        excludes:
          - Info.plist
          - WalkingCompanion.entitlements
      - path: Shared

    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.lhjtristram.walkingcompanion
        CODE_SIGN_ENTITLEMENTS: WalkingCompanion/WalkingCompanion.entitlements
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: ""
        ALWAYS_EMBED_SWIFT_STANDARD_LIBRARIES: YES
      configs:
        Debug:
          CODE_SIGN_IDENTITY: iPhone Developer
        Release:
          CODE_SIGN_IDENTITY: iPhone Distribution

    dependencies:
      - target: WalkingCompanionWatch
        embed: true

  # ── Apple Watch app ─────────────────────────────────────────────────────────
  WalkingCompanionWatch:
    type: application
    platform: watchOS
    deploymentTarget: "26.0"

    info:
      path: WalkingCompanionWatch/Info.plist

    sources:
      - path: WalkingCompanionWatch
        excludes:
          - Info.plist
          - WalkingCompanionWatch.entitlements
      - path: Shared

    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.lhjtristram.walkingcompanion.watchkitapp
        CODE_SIGN_ENTITLEMENTS: WalkingCompanionWatch/WalkingCompanionWatch.entitlements
        TARGETED_DEVICE_FAMILY: "4"
        ASSETCATALOG_COMPILER_APPICON_NAME: ""
      configs:
        Debug:
          CODE_SIGN_IDENTITY: iPhone Developer
        Release:
          CODE_SIGN_IDENTITY: iPhone Distribution
